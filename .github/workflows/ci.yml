name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 / node24
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y clang curl openssl iptables conntrack iproute2 util-linux kmod procps shellcheck zlib1g-dev
      - name: Shell syntax and static analysis
        run: |
          bash -n build.sh
          for script in module/*.sh tests/*.sh; do sh -n "$script"; done
          shellcheck -e SC2086,SC2154 build.sh module/*.sh tests/*.sh
      - name: Python contracts and packaging behavior
        run: make test-contracts
      - name: Strict native host tests
        run: STRICT=1 make test-native
      - name: Real HTTP/TLS download integration
        run: CXX=clang++ make test-download-integration
      - name: Real rule publishing and asynchronous update jobs
        run: sudo env CXX=clang++ make test-update-integration
      - name: ASan and UBSan suite
        run: make test-native-sanitize
      - name: Parser fuzz smoke
        run: FUZZ_CXX=clang++ FUZZ_RUNS=1000 FUZZ_REQUIRE_LIBFUZZER=1 make fuzz-smoke
      - name: Real kernel NFQUEUE IPv4/IPv6 integration
        run: CXX=clang++ make test-nfqueue-integration
      - name: Real engine routing and protocol integration
        run: sudo env CXX=clang++ make test-engine-integration
      - name: Real engine legacy iptables integration
        run: sudo env CXX=clang++ IPTABLES_BACKEND=legacy make test-engine-integration
      - name: Real manager freezer and daemon isolation regression
        run: sudo env CXX=clang++ make test-cgroup-integration
      - name: Retain fuzz diagnostics and crash inputs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / node24
        with:
          name: AD_Killer_By_NFQUEUE-fuzz-smoke
          if-no-files-found: ignore
          path: |
            dist/fuzz/report.json
            dist/fuzz/compiler-probe.log
            dist/fuzz/logs
            dist/fuzz/artifacts

  webui-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 / node24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 / node24
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test Vue frontend
        run: |
          npm --prefix frontend ci --include=dev --no-audit --no-fund
          make test-frontend
          RELEASE_CHANNEL=preview npm --prefix frontend run build -- --outDir ../dist/webui-channel-preview
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 / node24
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Phone, foldable and tablet layout and interaction regression
        run: python tests/test_webui_layout.py --screenshots dist/webui-preview
      - name: Same-version preview to stable browser upgrade regression
        run: python tests/test_webui_update_channels.py
      - name: Mobile counters and persistent update cache regression
        run: python tests/test_webui_persistent_state.py
      - name: Route loss and stale daemon image regression
        run: python tests/test_webui_route_recovery.py
      - name: Bounded viewport and stable navigation stress regression
        run: |
          python tests/test_webui_performance.py --verify
          python tests/test_webui_performance.py --verify --running
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / node24
        if: always()
        with:
          name: AD_Killer_By_NFQUEUE-WebUI-preview
          path: dist/webui-preview

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 / node24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 / node24
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
      - name: Build arm64 module
        run: NDK="$ANDROID_HOME/ndk/26.3.11579264" ./build.sh
      - name: Verify reproducible build
        run: |
          first=$(sha256sum dist/AD_Killer_By_NFQUEUE-v*.zip | cut -d' ' -f1)
          NDK="$ANDROID_HOME/ndk/26.3.11579264" ./build.sh
          second=$(sha256sum dist/AD_Killer_By_NFQUEUE-v*.zip | cut -d' ' -f1)
          test "$first" = "$second"
      - name: Validate module ZIP
        run: |
          python3 tests/validate_module_zip.py dist/AD_Killer_By_NFQUEUE-v*.zip
          python3 tests/verify_checksum.py dist/AD_Killer_By_NFQUEUE-v*.zip
          python3 tests/validate_manager_update.py dist/AD_Killer_By_NFQUEUE-v*.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / node24
        with:
          name: AD_Killer_By_NFQUEUE-module
          path: |
            dist/AD_Killer_By_NFQUEUE-v*.zip
            dist/AD_Killer_By_NFQUEUE-v*.zip.sha256
            dist/update.json
            dist/changelog.md
      - name: Build separately marked preview package
        run: RELEASE_CHANNEL=preview NDK="$ANDROID_HOME/ndk/26.3.11579264" ./build.sh
      - name: Validate preview package and channel separation
        run: |
          python3 tests/validate_module_zip.py dist/preview/AD_Killer_By_NFQUEUE-v*.zip
          python3 tests/verify_checksum.py dist/preview/AD_Killer_By_NFQUEUE-v*.zip
          python3 tests/validate_manager_update.py dist/preview/AD_Killer_By_NFQUEUE-v*.zip
          python3 tests/test_release_channels.py dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / node24
        with:
          name: AD_Killer_By_NFQUEUE-module-preview
          path: |
            dist/preview/AD_Killer_By_NFQUEUE-v*.zip
            dist/preview/AD_Killer_By_NFQUEUE-v*.zip.sha256
            dist/preview/update.json
            dist/preview/changelog.md

      - name: Resolve package version for upstream prechecks
        id: module_version
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: KernelSU official stable ZIP and listing precheck (no publication)
        uses: KernelSU-Modules/tools/actions/module-release@b6d340ddcd562ad482568b6e66b8d7a9c34d645e
        with:
          zip: dist/AD_Killer_By_NFQUEUE-${{ steps.module_version.outputs.version }}.zip
          dry-run: 'true'
          require-immutable: 'false'
      - name: KernelSU official preview ZIP and listing precheck (no publication)
        uses: KernelSU-Modules/tools/actions/module-release@b6d340ddcd562ad482568b6e66b8d7a9c34d645e
        with:
          zip: dist/preview/AD_Killer_By_NFQUEUE-${{ steps.module_version.outputs.version }}.zip
          dry-run: 'true'
          require-immutable: 'false'
